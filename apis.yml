aid: bomming
name: bomming
description: >-
  Zhuhai Boming Vision Technology Co., Ltd. (珠海博明视觉科技有限公司) is a Chinese high-tech
  industrial machine-vision company founded in September 2016 and headquartered in the
  Zhuhai High-tech Zone. It develops optical and machine-vision inspection technology for
  manufacturing quality control, including 3D structured-light sensors, flash measuring
  instruments (闪测仪), 2D/3D profile measurement systems, PCB back-drill thickness gauges,
  surface-defect inspection systems, glue-dispensing systems, and an AI deep-learning
  algorithm platform for automated visual inspection. Its solutions serve the lithium-battery,
  magnetic-materials, 3C electronics, semiconductor, photovoltaic, metalworking, and
  pharmaceutical industries. This is a hardware/equipment manufacturer with no public
  developer or API surface; the profile is retained as a VC-portfolio company lead.
